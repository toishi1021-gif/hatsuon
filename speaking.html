<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>チャレンジテストラボ スピーキング練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one reading column of word rows, sticky control strip on top — a listening drill for 中1 on a school tablet. */
:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --ink:#1C2A3A; --muted:#5E6E80; --line:#DCE4EC;
  --l1:#2E6DB4; --l2:#2E8B57; --l3:#C8611A; --l4:#6A4C93;
  --acc:#C0392B; --play:#FFF4D6; --ok:#1E8E5A; --okbg:#E3F5EC; --ng:#C0392B; --ngbg:#FBE6E3;
  --font-en:"Lexend", "Segoe UI", Arial, sans-serif;
  --font-jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111821; --surface:#1A2430; --ink:#E6EDF4; --muted:#9AAABB; --line:#2C3A49;
  --l1:#6EA6E8; --l2:#5CC18A; --l3:#F0954F; --l4:#B394DE; --acc:#FF7A6B; --play:#3A3320; --ok:#5CC18A; --okbg:#1D3A2C; --ng:#FF7A6B; --ngbg:#43231F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111821; --surface:#1A2430; --ink:#E6EDF4; --muted:#9AAABB; --line:#2C3A49;
  --l1:#6EA6E8; --l2:#5CC18A; --l3:#F0954F; --l4:#B394DE; --acc:#FF7A6B; --play:#3A3320; --ok:#5CC18A; --okbg:#1D3A2C; --ng:#FF7A6B; --ngbg:#43231F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-jp);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header h1{font-size:1.45rem;margin:0;text-wrap:balance;letter-spacing:.02em}
header p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs button,.chips button,.speed button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.38rem .9rem;cursor:pointer}
.tabs button{font-weight:700;font-size:1rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button[aria-pressed="true"]{color:#fff;border-color:transparent}
.chips button[data-l="0"][aria-pressed="true"]{background:var(--muted)}
.chips button[data-l="1"][aria-pressed="true"]{background:var(--l1)}
.chips button[data-l="2"][aria-pressed="true"]{background:var(--l2)}
.chips button[data-l="3"][aria-pressed="true"]{background:var(--l3)}
.speed{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.85rem}
.speed button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:transparent}
#q{flex:1 1 180px;min-width:0;font:inherit;padding:.45rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.go{font:inherit;font-weight:700;border:0;border-radius:10px;padding:.5rem 1rem;background:var(--ink);color:var(--bg);cursor:pointer}
.go.stop{background:var(--acc);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.warn{background:var(--play);border-radius:10px;padding:.6rem .8rem;margin-top:10px;font-size:.9rem}
.group{margin:18px 0 4px;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px}
.group i{display:inline-block;width:10px;height:10px;border-radius:50%}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li.item{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lc);border-radius:12px;padding:.55rem .7rem;cursor:pointer}
li.item.playing{background:var(--play)}
.no{font-family:var(--font-en);color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;text-align:right}
.main{min-width:0}
.w{font-family:var(--font-en);font-weight:600;font-size:1.35rem;line-height:1.2}
.k{font-size:.95rem;margin-left:.6rem;color:var(--ink)}
.k b{color:var(--acc);font-weight:700}
.m{color:var(--muted);font-size:.85rem}
.ex{font-size:.85rem;margin-top:2px}
.ex span{font-family:var(--font-en)}
.btns{display:flex;gap:6px}
.btns button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:.35rem .55rem;cursor:pointer;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:14px}
.modes button{font:inherit;font-weight:700;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:.55rem .3rem;cursor:pointer;line-height:1.3}
.modes button small{display:block;font-weight:500;font-size:.7rem;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.modes button[aria-pressed="true"] small{color:#fff}
.prog{display:grid;gap:6px;margin:14px 0 4px}
.prog .pr{display:grid;grid-template-columns:6.5rem minmax(0,1fr) 4.2rem;gap:8px;align-items:center;font-size:.85rem}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.pr span:last-child{font-family:var(--font-en);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.btns button.done{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
li.item.mastered .w{color:var(--ok)}
.toggle{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:1.1rem}
.panel p{margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.35rem .8rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);font-family:var(--font-en);font-variant-numeric:tabular-nums}
.qword{font-family:var(--font-en);font-weight:700;font-size:2rem;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.qja{font-size:1.4rem;font-weight:700;text-align:center}
.qsub{text-align:center;color:var(--muted);font-size:.9rem}
.qsub b{color:var(--acc)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{font:inherit;font-size:1rem;min-height:3.2rem;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:.5rem;cursor:pointer;overflow-wrap:anywhere}
.opts button.en{font-family:var(--font-en);font-weight:600}
.opts button.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opts button.ng{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.opts button:disabled{cursor:default}
.listen{align-self:center;font:inherit;font-weight:700;border:0;border-radius:999px;padding:.6rem 1.4rem;background:var(--l1);color:#fff;cursor:pointer}
.fb{text-align:center;font-weight:700;min-height:1.6em}
.fb.ok{color:var(--ok)}.fb.ng{color:var(--ng)}
.big{font-family:var(--font-en);font-size:2.6rem;font-weight:700;text-align:center;line-height:1}
.big small{font-size:1rem;color:var(--muted)}
.wrong{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wrong li{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:.4rem .7rem;background:var(--bg)}
.wrong li b{font-family:var(--font-en)}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ghost{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:.5rem 1rem;background:var(--surface);color:var(--ink);cursor:pointer}
.spell{font:inherit;font-family:var(--font-en);font-size:1.4rem;text-align:center;padding:.5rem;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.diff{font-family:var(--font-en);font-size:1.5rem;text-align:center;letter-spacing:.06em}
.diff .g{color:var(--ok)}.diff .r{color:var(--ng);text-decoration:underline}
.streak{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.streak .big{font-size:2.2rem}
.timer{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--acc);transition:width .2s linear}
@media (max-width:480px){.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.qword{font-size:1.7rem}}
@media (max-width:480px){.k{display:block;margin-left:0}.speed{margin-left:0}.bar{position:static}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<style>.panel label{display:flex;flex-direction:column;gap:4px;font-size:.9rem}.panel .row label{flex-direction:row;align-items:center;gap:6px}.panel select{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}#mic:disabled{opacity:.5}</style>
</head><body>

  <p>英語を声に出して言ってみよう。ちゃんと通じたら「通じた！」と出るよ。</p>
</header>

<div id="stage"></div>
<p class="note">判定は、端末の音声認識が聞き取った英語と、お手本が同じかどうかで行います。声は文字にするために一時的に Google や Apple のしくみに送られますが、録音は保存しません。アクセントや音の細かい正確さまでは判定できないので、お手本の音声をよく聞いてまねしよう。</p>

<script>
(function(){
const API='https://script.google.com/macros/s/AKfycbwS1hEQIVW8ncaNko9Vg1hQv1nPujz3Es5oyAPtkHD4bl5oVnvqK0KRpbFu2BMfOXN4/exec';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  return p;}
function auStop(){if(AU&&AU.cur){const s=AU.cur;AU.cur=null;try{s.stop();}catch(e){}}}
function synthSay(t,sp,id,busy){if(!synth)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=sp==='110'?0.55:sp==='130'?0.7:0.85;
  const go=()=>{if(id===sayId)synth.speak(u);};busy?setTimeout(go,120):go();}
function say(t,sp){sp=sp||'150';const id=++sayId;auStop();const busy=!!synth&&(synth.speaking||synth.pending);if(busy)synth.cancel();
  const i=AU&&AU.fails<3?AU.idx.get((t||'').trim()):undefined;
  if(i===undefined){synthSay(t,sp,id,busy);return;}
  ac();const [st,du]=AUDIO.at[sp][i];let late=false;
  const to=setTimeout(()=>{late=true;if(id===sayId)synthSay(t,sp,id,true);},2500);
  auLoad(sp,AUDIO.chunk[i]).then(buf=>{clearTimeout(to);if(late||id!==sayId)return;
    const x=ac();const src=x.createBufferSource();src.buffer=buf;src.connect(x.destination);src.onended=()=>{if(AU.cur===src)AU.cur=null;};AU.cur=src;src.start(0,Math.max(0,st-0.03),du+0.15);
  }).catch(()=>{clearTimeout(to);if(!late&&id===sayId)synthSay(t,sp,id,true);});}
/* sound effects */
let actx=null;function ac(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;try{actx=new C({sampleRate:22050});}catch(e){actx=new C();}try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}}if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function tone(c,f,s,d,t,v){const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.setValueAtTime(f,c.currentTime+s);g.gain.setValueAtTime(0.0001,c.currentTime+s);g.gain.exponentialRampToValueAtTime(v,c.currentTime+s+0.015);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+s+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+s);o.stop(c.currentTime+s+d+0.05);}
function sfx(k){const c=ac();if(!c)return;if(k==='ok'){tone(c,1318.5,0,0.32,'sine',0.35);tone(c,1046.5,0.16,0.5,'sine',0.35);}else if(k==='ng'){tone(c,155,0,0.5,'sawtooth',0.16);}else if(k==='fan'){[523.3,659.3,784,1046.5].forEach((f,i)=>tone(c,f,i*0.13,i===3?0.6:0.2,'triangle',0.3));}}
/* items */
const TABS=[['verbs','動詞'],['nouns','名詞'],['adjs','形容詞・副詞'],['extras','曜日・月・国'],['qwords','疑問詞'],['convo','会話表現'],['idioms','熟語']];
const NOLV=['extras','convo'];
const okItem=d=>d.w&&d.m&&!/[～…＋]/.test(d.w)&&!/\bA and B\b/.test(d.w);
const targets=d=>d.w.split('／').map(x=>x.trim()).filter(Boolean);
let tab='verbs',level=0;
/* matching */
const norm=t=>t.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const HOMO=[['two','too','to','2'],['four','for','4'],['one','won','1'],['eight','ate','8'],['see','sea','c'],['know','no'],['right','write'],['meet','meat'],['hour','our'],['buy','by','bye'],['i','eye'],['hi','high'],['new','knew'],['tea','tee','t'],['week','weak'],['sun','son'],['hear','here'],['there','their'],['night','knight'],['read','red','reed'],['flower','flour'],['wear','where'],['dear','deer'],['ok','okay'],['tv','t v'],['the uk','uk','the u k']];
const variants=w=>{const n=norm(w);const out=new Set([n]);HOMO.forEach(g=>{if(g.includes(n))g.forEach(x=>out.add(x));});return [...out];};
function judge(alts,d){
  for(const t of targets(d)){const T=norm(t);const V=variants(t);
    for(const a of alts){const A=norm(a);if(!A)continue;
      if(V.includes(A))return true;
      if((' '+A+' ').includes(' '+T+' '))return true;
      if(T.split(' ').length>=3){const tw=T.split(' '),aw=new Set(A.split(' '));const hit=tw.filter(x=>aw.has(x)).length;if(hit>=Math.ceil(tw.length*0.8))return true;}
    }}
  return false;
}
/* recognition */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(cb){
  let rec;try{rec=new SR();}catch(e){cb({err:'start'});return null;}
  rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;
  let done=false;
  rec.onresult=e=>{done=true;cb({alts:[...e.results[0]].map(a=>a.transcript)});};
  rec.onerror=e=>{if(done)return;done=true;cb({err:e.error});};
  rec.onend=()=>{if(!done){done=true;cb({err:'no-speech'});}};
  try{rec.start();}catch(e){done=true;cb({err:'start'});}
  return rec;
}
const ERR={'not-allowed':'マイクが使えません。ブラウザのマイクの許可を確かめてね。','service-not-allowed':'音声認識が使えません。iPad の場合は「設定」→「一般」→「キーボード」の「音声入力」をオンにしてね。','network':'インターネットにつながっていません。','no-speech':'声が聞こえなかったよ。もう一度、マイクに近づいて言ってみてね。','audio-capture':'マイクが見つかりません。','start':'聞き取りを始められませんでした。もう一度押してね。'};
/* setup screen */
function setup(){
  if(!SR){$('#warn').hidden=false;$('#warn').innerHTML='この端末やブラウザでは音声認識が使えません。Chromebook や Android は Chrome で、iPad は Safari で開いてね。iPad では「設定」→「一般」→「キーボード」の「音声入力」をオンにしてね。';}
  const items=DATA[tab].filter(okItem);
  $('#stage').innerHTML=`<div class="panel"><h2>何を練習する？</h2>
   <div class="seg" role="group" aria-label="種類">${TABS.map(([k,v])=>`<button data-tab="${k}" aria-pressed="${k===tab}">${v}</button>`).join('')}</div>
   ${NOLV.includes(tab)?'':`<div class="seg" role="group" aria-label="レベル">${[0,1,2,3].map(l=>`<button data-l="${l}" aria-pressed="${l===level}">${l?'レベル'+l:'すべて'}</button>`).join('')}</div>`}
   <p class="qsub">1問につき2回までチャレンジできるよ。10問で何問通じるかな？</p>
   <div class="acts"><button class="go" id="start"${items.length?'':' disabled'}>スタート</button></div></div>`;
}
/* game */
let G=null;
function start(){
  const pool=DATA[tab].filter(okItem).filter(d=>NOLV.includes(tab)||!level||d.l===level);
  if(!pool.length)return;
  G={items:shuffle(pool).slice(0,10),i:0,score:0,tries:0,wrong:[],locked:false};show();
}
function show(){
  const d=G.items[G.i];G.tries=0;G.locked=false;
  $('#stage').innerHTML=`<div class="panel"><div class="qhead"><span>スピーキング</span><span>${G.i+1} / ${G.items.length}　通じた ${G.score}</span></div>
   <div class="qword">${esc(d.w)}</div><div class="qsub">${kana(d.k)}</div><p class="qja" style="font-size:1.1rem">${esc(d.m)}</p>
   <div class="acts"><button class="ghost" id="model">お手本を聞く</button><button class="ghost" id="tspeed">テストの速さ</button><button class="ghost" id="slow">ゆっくり聞く</button></div>
   <div class="acts"><button class="listen" id="mic" style="font-size:1.1rem;padding:.9rem 2rem">🎤 押して話す</button></div>
   <div class="fb" id="fb" aria-live="polite"></div><div class="acts" id="nb"></div></div>`;
}
function mic(){
  if(!SR||G.locked)return;const d=G.items[G.i];G.locked=true;
  const b=$('#mic');b.textContent='聞いているよ…';b.style.background='var(--acc)';
  sayId++;auStop();if(synth)synth.cancel();
  listen(r=>{
    b.textContent='🎤 押して話す';b.style.background='';
    const fb=$('#fb');
    if(r.err){G.locked=false;fb.className='fb ng';fb.textContent=ERR[r.err]||('うまく聞き取れませんでした（'+r.err+'）');return;}
    const heard=r.alts[0]||'';
    if(judge(r.alts,d)){G.score++;sfx('ok');fb.className='fb ok';fb.innerHTML=`通じた！　<span style="font-family:var(--font-en)">「${esc(heard)}」</span>`;next();}
    else{G.tries++;sfx('ng');fb.className='fb ng';
      if(G.tries<2){fb.innerHTML=`<span style="font-family:var(--font-en)">「${esc(heard)}」</span>と聞こえたよ。お手本を聞いて、もう一度！`;G.locked=false;}
      else{G.wrong.push(d);fb.innerHTML=`<span style="font-family:var(--font-en)">「${esc(heard)}」</span>と聞こえたよ。次はがんばろう！`;say(targets(d)[0]);next();}}
  });
}
function next(){$('#nb').innerHTML='<button class="go" id="next">次へ</button>';$('#mic').disabled=true;}
function finish(){
  const n=G.items.length;if(G.score===n)setTimeout(()=>sfx('fan'),300);
  $('#stage').innerHTML=`<div class="panel"><h2>結果</h2><div class="big">${G.score}<small> / ${n} 問 通じた</small></div>
   ${acct?'<p class="qsub" id="rk">ランキングに送信中…</p>':''}
   ${G.wrong.length?`<p><b>もう一度練習したい単語</b>（タップでお手本）</p><ul class="wrong">${G.wrong.map((d,i)=>`<li data-wi="${i}"><b>${esc(d.w)}</b><span>${esc(d.m)}</span></li>`).join('')}</ul>`:'<p class="qsub">全部通じた！すばらしい！</p>'}
   <div class="acts">${G.wrong.length?'<button class="go" id="retry">もう一度練習したい単語だけ</button>':''}<button class="ghost" id="again">もう一度</button><button class="ghost" id="back">練習する種類を変える</button></div></div>`;
  if(acct&&G.score>0)post({action:'submit',id:acct.id,pin:acct.pin,kind:'speak',value:Math.min(G.score,10)}).then(r=>{const e=$('#rk');if(!e)return;
      if(r&&r.ok){const m=r.me&&r.me.speak;e.innerHTML=m?`ランキングに反映したよ！　今週のスピーキング：<b>${m.rank}位</b>（${m.n}人中）`:'ランキングに反映したよ！';}
      else e.textContent=(r&&r.msg&&r.msg.indexOf('あいことば')>=0)?'あいことばが合っていないよ。「登録を変える」から登録しなおしてね。':'ランキングに送れませんでした。';})
    .catch(()=>{const e=$('#rk');if(e)e.textContent='通信できませんでした。';});
  else{const e=$('#rk');if(e)e.textContent='';}
}
function post(obj){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(obj)}).then(r=>r.json());}
/* login form */
function loginForm(){
  const opt=n=>Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  $('#stage').innerHTML=`<div class="panel"><h2>ランキングの登録をした人</h2><p>チャレンジテストラボのページで登録した組・番号・あいことばを入れてね。まだ登録していない人は、チャレンジテストラボのページの「ランキング」で登録してね。</p>
   <div class="row"><label>組 <select id="lcls">${opt(5)}</select></label><label>番号 <select id="lno">${opt(45)}</select></label></div>
   <label>あいことば（数字4けた）<input id="lpin" class="spell" style="font-size:1.1rem" inputmode="numeric" maxlength="4" autocomplete="off"></label>
   <div class="acts"><button class="go" id="ldo">続きから使う</button><button class="ghost" id="back">やめる</button></div><p class="qsub" id="lmsg"></p></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');ac();
  if(t&&t.dataset.tab){tab=t.dataset.tab;level=0;setup();return;}
  if(t&&t.dataset.l!==undefined){level=+t.dataset.l;setup();return;}
  const id=t&&t.id;
  if(id==='start'||id==='again'){start();return;}
  if(id==='model'&&G){say(targets(G.items[G.i])[0],'150');return;}
  if(id==='tspeed'&&G){say(targets(G.items[G.i])[0],'130');return;}
  if(id==='slow'&&G){say(targets(G.items[G.i])[0],'110');return;}
  if(id==='mic'){mic();return;}
  if(id==='next'){G.i++;G.i<G.items.length?show():finish();return;}
  if(id==='retry'){G={items:shuffle(G.wrong),i:0,score:0,tries:0,wrong:[],locked:false};show();return;}
  if(id==='back'){G=null;setup();return;}
  if(id==='logout'||id==='loginbtn'){acct=null;store.set('acct',null);showWho();loginForm();return;}
  if(id==='ldo'){const p={action:'login',cls:+$('#lcls').value,no:+$('#lno').value,pin:$('#lpin').value.trim()};$('#lmsg').textContent='確認中…';
    post(p).then(r=>{if(!r.ok){$('#lmsg').textContent=r.msg||'見つかりませんでした。';return;}acct={id:r.id,pin:p.pin,nick:r.nick,cls:r.cls};store.set('acct',acct);showWho();setup();}).catch(()=>{$('#lmsg').textContent='通信できませんでした。';});return;}
  const wli=e.target.closest('.wrong li');if(wli&&G){say(targets(G.wrong[+wli.dataset.wi])[0]);}
});
showWho();setup();
})();
</script>
